
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deep Copy</title>
</head>
<body>
    <script>
        let emp = [
            {
                emp_id: 101,
                emp_name: "Srihari",
                salary: 500000,
                skills: ["cpp", "python", "java"]
            },
            {
                emp_id: 102,
                emp_name: "Rajesh",
                salary: 500000,
                skills: ["JavaScript", "React"]
            },
            {
                emp_id: 103,
                emp_name: "Hari",
                company: {
                    c1: "Tcs",
                    c2: "Accenture"
                }
            }
        ];

        // Deep Copy
        let copied_data = JSON.parse(JSON.stringify(emp));

        // Modifying copied data
        copied_data[2].company.c1 = "Google";
        copied_data[0].salary = 80000;
        copied_data[0].skills.push("React");

        console.log("Original Data", emp);
        console.log("Copied Data", copied_data);

        console.log("Original Company:", emp[2].company.c1);
        console.log("Copied Company:", copied_data[2].company.c1);
    </script>
</body>
</html>
